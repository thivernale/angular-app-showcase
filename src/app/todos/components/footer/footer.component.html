<footer class="card-footer d-flex align-items-center fs-6" [ngClass]="{'d-none': this.noTodos()}">
  <div class="flex-grow-0 col-4">{{ this.numActiveTodos() }} item{{ this.numActiveTodos() !== 1 ? "s" : "" }} left
  </div>
  <div class="d-flex align-items-center gap-2 justify-content-center">
    @for (sf of stateFilterEntries; track sf) {
      <button class="btn" [ngClass]="{'active': stateFilterSignal() === sf[0]}"
              (click)="changeFilter(sf[0])">{{ sf[1] }}
      </button>
    }
  </div>
</footer>
