<section class="card-body" [ngClass]="{'d-none': this.visibleTodosSignal().length === 0}">
  <ul class="list-group">
    @for (item of visibleTodosSignal(); track item.id) {
      <app-todo
        [todoInput]="item"
        [editMode]="item.id === editIdSignal()"
        (setEditId)="editIdSignal.set($event)"
      />
    }
  </ul>
</section>
