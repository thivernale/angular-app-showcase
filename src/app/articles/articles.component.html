<div class="container gap-2 d-flex flex-column">
  <h1 class="h1 font-monospace text-center">Articles</h1>
  <form (ngSubmit)="onSubmit()" [formGroup]="form" class="form-group">
    <input autocomplete="off" class="form-control" formControlName="searchText" name="search-text"
           placeholder="Search...">
  </form>
  @for (article of articlesSignal(); track $index) {
    <div class="card shadow">
      <div class="card-body">
        <a [routerLink]="['/articles', article.slug]" class="text-black">
          <h5 class="card-title">{{ article.title }}</h5>
        </a>
        <div class="card-subtitle mt-1 mb-3 text-secondary">
          Created on {{ article.createdAt | date : 'mediumDate' }} by
          <i class="fa fa-user" title="{{ article.author.username }}"></i> {{ article.author.username }}
        </div>
        <p class="card-text">{{ article.description }}</p>
        <div>
          @for (tag of article.tagList; track $index) {
            <button (click)="setSearchText(tag)" class="btn p-0 mx-1">
              <span class="badge bg-secondary">{{ tag }}</span>
            </button>
          }
        </div>
      </div>
    </div>
  }
</div>
