<div class="card">
  <div class="card-header">{{ vehicle.name }}</div>
  <div class="card-body d-flex flex-column gap-2">
    <h5 class="card-title">{{ vehicle.name }}</h5>
    <div class="fs-6 card-subtitle text-secondary">Current location: {{ getLocationName(vehicle.location) }}</div>
    <label for="location-select" class="form-label">
      Change location to:
      <select class="form-select mt-1" (change)="changeLocation($event)">
        @for (region of getRegions(); track region.id) {
          <option [value]="region.id">{{ region.name }}</option>
        }
      </select>
    </label>
  </div>
</div>
